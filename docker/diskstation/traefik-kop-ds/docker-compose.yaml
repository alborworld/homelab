services:
  # https://www.reddit.com/r/Traefik/comments/w8v52z/running_traefik_with_multiple_docker_hosts/
  traefik-kop-ds:
    image: "ghcr.io/jittering/traefik-kop:0.19.3"
    container_name: TreaefikKop-DS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_ADDR=${RASPBERRYPI_IP}:6379
      - BIND_IP=${DISKSTATION_IP}
      - KOP_HOSTNAME=diskstation
    labels:
      # WUD
      - wud.watch=false
    restart: always
