services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: Homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${LOCAL_DOMAIN},${RASPBERRYPI_IP},raspberrypi.home
      PUID: ${UID}
      PGID: ${GID}
      HOMEPAGE_VAR_LOCAL_DOMAIN: ${LOCAL_DOMAIN}
      HOMEPAGE_VAR_DOCKERHOST_IP: ${DOCKERHOST_IP}
      HOMEPAGE_VAR_DISKSTATION_IP: ${DISKSTATION_IP}
    volumes:
      - ./config:/app/config
      - ${VOLUMEDIR}/homepage/logs:/app/logs:rw
    labels:
      # TRAEFIK
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`${LOCAL_DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.tls.certresolver=cloudflare
      # WUD
      - wud.trigger.include=telegram.1,docker.auto
    restart: unless-stopped

  homepage-revalidate:
    # Homepage bakes settings.yaml (layout, theme, background, etc.) into its
    # Next.js static page at build/start time — unlike services.yaml/docker
    # labels, which are read live. Whenever the Homepage container (re)starts
    # for any reason (WUD auto-update, manual recreate, host reboot), poke
    # /api/revalidate so the dashboard picks up the current settings.yaml
    # instead of serving a stale cached shell. See homelab-gdq.
    image: docker:cli
    container_name: HomepageRevalidate
    depends_on:
      - homepage
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: sh
    command:
      - -c
      - |
        apk add --no-cache curl >/dev/null
        docker events --filter 'container=Homepage' --filter 'event=start' --format '{{.Time}}' | while read -r _; do
          sleep 5
          curl -sf -H 'Host: raspberrypi.home' http://homepage:3000/api/revalidate >/dev/null || true
        done
    labels:
      - wud.watch=false
    restart: unless-stopped
